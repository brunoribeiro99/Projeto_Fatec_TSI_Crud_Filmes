<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link rel="stylesheet" href="./css/contato.css">

</head>

<body>
   <div class="intro">

    <svg class="logo-m" viewBox="0 0 200 250">

        <path
    class="m-traco"
    d="M 30 220 L 30 30 L 100 150 L 170 30 L 170 220"
/>
<audio id="somIntro" src="./audio/tum.mp3" preload="auto"></audio>
    </svg>

</div>


    <header class="metflix-navbar">

        <nav class="navbar navbar-expand-lg">

            <div class="container-fluid">

                <a class="nome" href="index.html">METFLIX</a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNavDropdown"
                        aria-controls="navbarNavDropdown"
                        aria-expanded="false"
                        aria-label="Abrir menu">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="navbarNavDropdown">

                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Início
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Filmes
                            </a>
                        </li>

                        <li class="nav-item dropdown">

                            <a class="nav-link dropdown-toggle active"
                               href="#"
                               role="button"
                               data-bs-toggle="dropdown"
                               aria-expanded="false">

                                Outros

                            </a>

                            <ul class="dropdown-menu">

                                <li>
                                    <a class="dropdown-item" href="sobre.html">
                                        Sobre
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item" href="contato.html">
                                        Contato
                                    </a>
                                </li>

                            </ul>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

    <main class="contato">

        <h1>Contato</h1>

        <div class="container">

            <form class="row g-3">

                <div class="col-md-6">

                    <label for="inputEmail4" class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           id="inputEmail4"
                           placeholder="hugo_reidelas_ofodastico@gmail.com">

                </div>


                <div class="col-md-6">

                    <label for="inputPassword4" class="form-label">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="inputPassword4"
                           placeholder="Digite sua senha">

                </div>


                <div class="col-12">

                    <label for="inputnome" class="form-label">
                        Nome
                    </label>

                    <input type="text"
                           class="form-control"
                           id="inputnome"
                           placeholder="Mark Zuckerberg">

                </div>


                <div class="col-12 col-md-2">

                    <label for="inputIdade" class="form-label">
                        Idade
                    </label>

                    <input type="number"
                           class="form-control"
                           id="inputIdade"
                           placeholder="28">

                </div>


                <div class="col-12 col-md-5">

                    <label for="inputcivil" class="form-label">
                        Estado Civil
                    </label>

                    <select id="inputcivil" class="form-select">

                        <option selected>Escolha...</option>
                        <option>Traindo</option>
                        <option>Em um relacionamento complicado</option>
                        <option>Em um relacionamento aberto</option>
                        <option>Solteiro(a)</option>
                        <option>Casado(a)</option>
                        <option>Divorciado(a)</option>
                        <option>Viúvo(a)</option>

                    </select>

                </div>


                <div class="col-12 col-md-5">

                    <label for="inputZip" class="form-label">
                        WhatsApp
                    </label>

                    <input type="text"
                           class="form-control"
                           id="inputZip"
                           placeholder="(17) 4002-8922">

                </div>


                <div class="col-md-5">

                    <label for="inputcidade" class="form-label">
                        Cidade
                    </label>

                    <input type="text"
                           class="form-control"
                           id="inputcidade"
                           placeholder="FerpaCaps">

                </div>


                <div class="col-md-5">

                    <label for="inputCep" class="form-label">
                        CEP
                    </label>

                    <input type="text"
                           class="form-control"
                           id="inputCep"
                           placeholder="12345-678">

                </div>


                <div class="col-2">

                    <label for="inputUF" class="form-label">
                        UF
                    </label>

                    <select id="inputUF" class="form-select">

                        <option selected>Escolha...</option>
                        <option>SP</option>
                        <option>RJ</option>
                        <option>MG</option>
                        <option>RS</option>
                        <option>RN</option>
                        <option>DF</option>
                        <option>GO</option>

                    </select>

                </div>


                <div class="col-12">

                    <div class="form-check">

                        <input class="form-check-input"
                               type="checkbox"
                               id="gridCheck">

                        <label class="form-check-label" for="gridCheck">

                            Você aceita receber nossas novidades de catálogos de filmes?

                        </label>

                    </div>

                </div>


                <div class="col-6">

                    <button type="submit"
                            class="btn btn-primario btn-lg w-100">

                        Log in

                    </button>

                </div>


                <div class="col-6">

                    <button type="submit"
                            class="btn btn-secundario btn-lg w-100">

                        Sign up

                    </button>

                </div>

            </form>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
    </script>

<script>
    const som = document.getElementById("somIntro");

    setTimeout(function () {
        som.play().catch(function () {
            console.log("O navegador bloqueou o áudio automático.");
        });
    }, 2000);

    setTimeout(function () {
        document.querySelector(".intro").classList.add("sair");
    }, 2800);
</script>

</body>

</html>
